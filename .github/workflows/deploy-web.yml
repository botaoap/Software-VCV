name: Deploy web

# Builds the static Astro site (`site/`) and publishes it to GitHub Pages so Felipe always has a
# current live link. Auto-deploys on push to `develop` (the integration branch), and can be run
# manually from the Actions tab.
#
# The Pages *project* URL is a sub-path (https://<user>.github.io/<repo>/), so the build gets
# SITE_URL + BASE_PATH (astro.config.mjs): every internal link, canonical and OG URL is
# sub-path-correct, and `404.html` is served by Pages for any unknown URL. A custom domain served
# at the root (Felipe's, later) just drops BASE_PATH and sets SITE_URL.
#
# One-time repo setup: Settings → Pages → Build and deployment → Source = "GitHub Actions".
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build (type-check + static pages)
        run: npm run build

      - name: Test the built site
        run: npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
