name: Deploy web (staged)

# STAGED, MANUAL-ONLY deploy to GitHub Pages — the zero-cost default until Felipe
# picks hosting/domain (VCV-12 Phase 3 is blocked on that decision). It is NOT
# wired to auto-deploy on merge on purpose.
#
# ⚠️ Known limitation at the Pages *project* URL (https://<user>.github.io/Software-VCV/):
# the app is served from a sub-path, but the router (RouteCodec / web-history) and
# some asset paths assume the site lives at "/". Deep-link refresh (e.g.
# /produto/{id}) and assets will not fully resolve under a sub-path. The 404.html
# fallback below covers unknown paths, but a correct deployment needs either a
# custom domain served at root, or base-path handling in the web build + router.
# Treat this as a preview of the home/landing render, not a deep-link-correct site.
#
# Trigger from the Actions tab → "Deploy web (staged)" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Wasm distribution
        run: ./gradlew --no-daemon --stacktrace :webApp:wasmJsBrowserDistribution

      - name: SPA fallback (serve index.html for unknown paths)
        run: |
          dist=webApp/build/dist/wasmJs/productionExecutable
          cp "$dist/index.html" "$dist/404.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
