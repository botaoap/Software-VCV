name: Deploy web

# Builds the Wasm web app and publishes it to GitHub Pages so Felipe always has a
# current live link. Auto-deploys on push to `develop` (the integration branch),
# and can be run manually from the Actions tab.
#
# The Pages *project* URL is a sub-path (https://<user>.github.io/<repo>/). The build
# is made sub-path-correct here by rewriting `<base href="/">` to `/<repo>/`; the
# router derives its base path from that <base> at runtime (WebHistory), and 404.html
# = index.html gives SPA deep-link refresh. A root custom domain (Felipe's, later)
# would just drop the base rewrite.
#
# One-time repo setup: Settings → Pages → Build and deployment → Source = "GitHub Actions".
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Wasm distribution
        run: ./gradlew --no-daemon --stacktrace :webApp:wasmJsBrowserDistribution

      - name: Rewrite base href for the Pages sub-path + SPA fallback
        run: |
          dist=webApp/build/dist/wasmJs/productionExecutable
          repo="${{ github.event.repository.name }}"
          # Project site is served under /<repo>/ — point <base> there so relative
          # resource fetches and the router's derived base path resolve correctly.
          sed -i "s#<base href=\"/\">#<base href=\"/${repo}/\">#" "$dist/index.html"
          # GitHub Pages serves 404.html for unknown paths → serve the SPA so deep
          # links (e.g. /produto/{id}) refresh into the app instead of 404ing.
          cp "$dist/index.html" "$dist/404.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
