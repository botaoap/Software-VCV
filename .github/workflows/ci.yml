name: CI

# Build + test on every PR into develop/main (and on pushes to those branches).
# Keeps the integration branches green and verifies the deployable web artifact.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site (Astro) build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # astro check (types) + static build; placeholder photos are optimised at build time.
      - name: Build
        run: npm run build

      # Contrast tokens + rules on the built HTML (SEO tags, external links, self-hosted assets,
      # catalog order, JSON-LD).
      - name: Test
        run: npm test

  build-test:
    name: Build & test (non-Apple targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write the dependency cache from the default branch, so PR runs
          # read a warm cache without each one persisting its own entry.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      # iOS is intentionally NOT built here: Kotlin/Native iOS targets require a
      # macOS runner. Add a gated macOS job if/when the iOS app is prioritised
      # (see the VCV-12 plan note).
      - name: Build & test
        run: |
          ./gradlew --no-daemon --stacktrace \
            :shared:jvmTest \
            :androidApp:assembleDebug \
            :desktopApp:compileKotlin \
            :server:build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7
