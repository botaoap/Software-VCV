<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Pin the document base to the site root so ALL relative URLs — including Compose's runtime
         `./composeResources/…` resource fetches — resolve against "/" regardless of the current route.
         Without this, at a nested route like /produto/{id} or /colecao/{slug} the resource fetch
         resolves to /produto/composeResources/… (404) and the bundled catalog JSON fails to load.
         (Root-hosted deploy assumed; a sub-path deploy would need href="/<base>/". See VCV-12.) -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCV — Veste Com Você</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="splash" role="presentation">
        <div class="wordmark">VCV</div>
        <div class="tagline">Veste Com Você</div>
        <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" stroke="#EFE0D8" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#6E2B39" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                  repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
