<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Pin the document base to the site root so ALL relative URLs — including Compose's runtime
         `./composeResources/…` resource fetches — resolve against "/" regardless of the current route.
         Without this, at a nested route like /produto/{id} or /colecao/{slug} the resource fetch
         resolves to /produto/composeResources/… (404) and the bundled catalog JSON fails to load.
         (Root-hosted deploy assumed; a sub-path deploy would need href="/<base>/". See VCV-12.) -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCV — Veste Com Você</title>
    <meta name="description" content="Ateliê de moda feminina em Gaspar, Vale do Itajaí. Poucas peças, bem feitas — viscose e linho, com ficha técnica em cada peça.">
    <meta name="theme-color" content="#F6F0EA">
    <!-- Brand monogram favicon (wine square, cream "V") — inline so there's no extra request. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236E2B39'/><text x='16' y='23' font-family='Georgia,serif' font-size='18' fill='%23F6F0EA' text-anchor='middle'>V</text></svg>">
    <!-- Open Graph / Twitter: so a shared link (WhatsApp, Instagram) unfurls with the brand + an image.
         og:image is a placeholder campaign photo until Felipe's real photography lands (VCV-30/VCV-34). -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VCV — Veste Com Você">
    <meta property="og:title" content="VCV — Veste Com Você">
    <meta property="og:description" content="Ateliê de moda feminina em Gaspar, Vale do Itajaí. Poucas peças, bem feitas.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1200&h=630&fit=crop&q=80">
    <meta property="og:locale" content="pt_BR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="VCV — Veste Com Você">
    <meta name="twitter:description" content="Ateliê de moda feminina em Gaspar, Vale do Itajaí. Poucas peças, bem feitas.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1200&h=630&fit=crop&q=80">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="splash" role="presentation">
        <div class="wordmark">VCV</div>
        <div class="tagline">Veste Com Você</div>
        <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" stroke="#EFE0D8" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#6E2B39" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                  repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
